name: Rule or feature request
description: Propose a deterministic check or integration.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which real project failure should be caught earlier?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal example
      description: Show the project metadata and the expected diagnostic.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing alternatives
